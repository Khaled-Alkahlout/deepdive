    <g id="text_21">
     <text style="font-size: 13px; font-family: 'Segoe UI', 'Inter', 'Helvetica Neue', 'Arial', 'DejaVu Sans', sans-serif; text-anchor: start; fill: #14161a" x="354.964531" y="119.6404" transform="rotate(-0 354.964531 119.6404)">Opus 5.5</text>
