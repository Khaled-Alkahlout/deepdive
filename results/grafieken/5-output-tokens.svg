  <g id="text_22">
   <text style="font-weight: 700; font-size: 27px; font-family: 'Segoe UI', 'Inter', 'Helvetica Neue', 'Arial', 'DejaVu Sans', sans-serif; text-anchor: start; fill: #14161a" x="34.56" y="49.148438" transform="rotate(-0 34.56 49.148438)">Mediaan output tokens bij high: Haiku 2.498, Sonnet 1.074, Opus 1.197</text>
  </g>
  <g id="text_23">
   <text style="font-size: 15px; font-family: 'Segoe UI', 'Inter', 'Helvetica Neue', 'Arial', 'DejaVu Sans', sans-serif; text-anchor: start; fill: #4b5058" x="34.56" y="79.304062" transform="rotate(-0 34.56 79.304062)">Staaf = mediaan, streepje = 10e tot 90e percentiel (n = 48 antwoorden per staaf, alle queries en contexten).</text>
  </g>
  <g id="text_24">
   <text style="font-size: 11.5px; font-family: 'Segoe UI', 'Inter', 'Helvetica Neue', 'Arial', 'DejaVu Sans', sans-serif; text-anchor: start; fill: #7b808a" x="34.56" y="611.597906" transform="rotate(-0 34.56 611.597906)">Output tokens bevatten ook de denktokens (reasoning) vóór het antwoord en bepalen de kosten (output is 5x duurder dan input).</text>
  </g>
  <g id="text_25">
   <text style="font-size: 11.5px; font-family: 'Segoe UI', 'Inter', 'Helvetica Neue', 'Arial', 'DejaVu Sans', sans-serif; text-anchor: start; fill: #7b808a" x="34.56" y="631.037906" transform="rotate(-0 34.56 631.037906)">Meer output tokens betekent niet automatisch een beter antwoord: zie grafiek 2 en 3 voor wat er per model werd opgelost.</text>
